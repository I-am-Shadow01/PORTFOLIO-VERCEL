name: Portfolio checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Interactivity smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: verify/package-lock.json
      - name: Install headless test dependencies
        working-directory: verify
        run: npm ci --no-audit --no-fund
      - name: Test real app boot and interactions
        working-directory: verify
        run: node smoke.mjs ..
