name: Site quality checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test framework
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Desktop and mobile interactions
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-visual-qa
          path: |
            test-results/*.png
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
