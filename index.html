<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CID KAGENOU — Full-Stack Developer and DevOps Engineer.">
  <meta name="theme-color" content="#080810">
  <meta name="color-scheme" content="dark light">
  <title>CID KAGENOU — Portfolio</title>
  <!-- preload ฟอนต์น้ำหนักหลักที่ใช้ทันที (ลด FOIT ตอนเปิดหน้า) -->
  <link rel="preload" href="./fonts/anakotmai-medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/anakotmai-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./src/styles.css">
  <script>
    try {
      const settings = JSON.parse(localStorage.getItem('pf_settings') || '{}');
      const theme = settings.theme === 'light' ? 'light' : settings.theme === 'dark' ? 'dark' : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      if (settings.accent) document.documentElement.style.setProperty('--ac', settings.accent);
      if (settings.lang === 'th') document.documentElement.lang = 'th';
    } catch (_) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#hero">Skip to content</a>
  <div id="__root__"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
